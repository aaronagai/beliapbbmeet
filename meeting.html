<!DOCTYPE html>
<html lang="en">

<head>
    <title>Meeting · Belia PBB</title>

    <meta charset="UTF-8">
    <meta name="description" content="Belia PBB meeting">
    <meta name="author" content="Belia PBB">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            var pref = localStorage.getItem("belia-pbb-theme") || "system";
            var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
            document.documentElement.dataset.themePref = pref;
        })();
    </script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main>
        <p class="back"><a href="index.html" data-i18n="back">← All meetings</a></p>

        <section id="name-gate" class="name-gate" hidden>
            <h1 data-i18n="joinTitle">Join this meeting</h1>
            <p class="updated" data-i18n="joinHint">Enter your name so we can record who said what.</p>
            <form id="name-form" class="name-form">
                <label for="member-name" data-i18n="nameLabel">Your name</label>
                <input id="member-name" name="name" type="text" autocomplete="name" required maxlength="80">
                <button type="submit" data-i18n="continue">Continue</button>
            </form>
        </section>

        <section id="meeting-content" hidden>
            <p class="member-bar">
                <span id="member-status"></span>
                <button type="button" id="change-name" class="text-btn" data-i18n="changeName">Change</button>
            </p>
            <h1 id="meeting-title">Meeting</h1>
            <p class="attendees-link-row">
                <button type="button" id="attendees-open" class="attendees-link">• <span data-i18n="attendees">Attendees</span></button>
            </p>
            <p class="updated" id="meeting-date"></p>
            <div class="meeting-roles" id="meeting-roles">
                <div class="role">
                    <span class="role-label" data-i18n="chairedBy">This meeting is chaired by:</span>
                    <span class="role-value" id="meeting-chair"></span>
                </div>
                <div class="role">
                    <span class="role-label" data-i18n="minutesBy">Minutes taken by:</span>
                    <span class="role-value" id="meeting-minutes"></span>
                </div>
            </div>
            <p id="meeting-summary"></p>

            <h2 data-i18n="agenda">Agenda</h2>
            <div id="agenda"></div>
        </section>
    </main>

    <dialog id="attendees-dialog" class="attendees-dialog">
        <div class="attendees-dialog-header">
            <h2 data-i18n="attendeesTitle">Attendees</h2>
            <button type="button" id="attendees-close" class="text-btn" data-i18n="close">Close</button>
        </div>
        <p class="attendees-dialog-hint" data-i18n="attendeesHint">People who contributed to this meeting.</p>
        <ul id="attendees-list" class="list"></ul>
    </dialog>

    <footer>
        <div class="footer-row">
            <div class="lang-toggle" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="en">English</button>
                <span class="lang-sep" aria-hidden="true">·</span>
                <button type="button" class="lang-btn" data-lang="bm">BM</button>
            </div>
            <div class="theme-toggle" role="group" aria-label="Theme">
                <button type="button" class="theme-btn" data-theme-opt="light" data-i18n="themeLight">Light</button>
                <span class="theme-sep" aria-hidden="true">·</span>
                <button type="button" class="theme-btn" data-theme-opt="dark" data-i18n="themeDark">Dark</button>
                <span class="theme-sep" aria-hidden="true">·</span>
                <button type="button" class="theme-btn" data-theme-opt="system" data-i18n="themeSystem">System</button>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
