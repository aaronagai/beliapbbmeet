<!DOCTYPE html>
<html lang="en">

<head>
    <title>Belia PBB Meeting Space</title>

    <meta charset="UTF-8">
    <meta name="description" content="Belia PBB asynchronous meeting space">
    <meta name="author" content="Belia PBB">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            var pref = localStorage.getItem("belia-pbb-theme") || "system";
            var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
            document.documentElement.dataset.themePref = pref;
        })();
    </script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main>
        <p class="admin-error" data-error hidden></p>
        <h1 data-i18n="title">Belia PBB Meeting Space</h1>
        <p class="updated" data-i18n="updated">Today's date • Jul 28, 2026</p>

        <p data-i18n="intro1">One place for every discussion.</p>
        <p data-i18n="intro2">A shared space for Belia PBB to discuss matters asynchronously. Raise agenda items, share updates, gather feedback, and reach decisions without scheduling a meeting.</p>

        <h2 data-i18n="activeMeetings">Active meetings</h2>
        <div id="meetings"></div>

        <h2 data-i18n="closedMeetings">Closed</h2>
        <div id="closed-meetings"></div>
    </main>

    <footer>
        <div class="footer-row">
            <div class="lang-toggle" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="en">English</button>
                <span class="lang-sep" aria-hidden="true">·</span>
                <button type="button" class="lang-btn" data-lang="bm">BM</button>
            </div>
            <button type="button" class="theme-switch" data-theme-switch aria-label="Theme">
                <span class="theme-switch-icon" aria-hidden="true"></span>
            </button>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
